<!DOCTYPE html>
<html lang="bn"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MikroTik Script Studio Pro · Upgrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">

<!-- Modern Animation & Excel Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#edf1f6;--sf:rgba(255,255,255,0.88);--sf-solid:#ffffff;--sf2:#f0f3f8;
  --tx:#0e1a2b;--mu:#64748b;--bd:rgba(225,231,239,0.9);--ac:#0d9488;--ac2:#0284c7;
  --on:#fff;--ok:#12a36b;--wr:#b86e00;--code:#0b1220;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --sh:0 4px 20px rgba(15,27,45,.06),0 10px 30px rgba(15,27,45,.08);
  --glow:0 0 20px rgba(13,148,136,.22);
}
:root[data-theme=dark]{
  --bg:#060b14;--sf:rgba(15,24,38,0.84);--sf-solid:#0f1826;--sf2:#172336;
  --tx:#e6edf7;--mu:#8397b1;--bd:rgba(34,49,73,0.85);--ac:#2dd4bf;--ac2:#38bdf8;
  --on:#04201c;--wr:#f2b84b;--code:#040810;
  --sh:0 4px 24px rgba(0,0,0,.45),0 12px 36px rgba(0,0,0,.5);
  --glow:0 0 24px rgba(45,212,191,.18);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow-x:hidden}
body{
  font:14px/1.55 "Plus Jakarta Sans","Hind Siliguri","Segoe UI","Nirmala UI",system-ui,sans-serif;
  background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;
  position:relative;
}

/* Three.js Ambient Background Canvas */
#bg-canvas{
  position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0.55;
}

.app{
  position:relative;z-index:1;
  display:grid;grid-template-columns:278px minmax(0,1fr) 348px;gap:14px;padding:14px;height:100%;
}
.side,.basket{
  background:var(--sf);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);
  padding:16px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden;
  transition:border-color .25s ease, box-shadow .25s ease;
}
.side:hover,.basket:hover{border-color:color-mix(in srgb,var(--ac) 35%,var(--bd))}
main{min-height:0;overflow:auto;padding:2px 6px 0 2px;display:flex;flex-direction:column;scroll-behavior:smooth}
main>*{flex-shrink:0}

.brand{display:flex;gap:10px;align-items:center;font-weight:700;font-size:16px;line-height:1.2}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--mu)}
.logo{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  color:var(--on);display:grid;place-items:center;font-size:18px;
  box-shadow:var(--glow);position:relative;overflow:hidden;
}
#lottie-brand{width:34px;height:34px;display:grid;place-items:center}

.mu{color:var(--mu)}.note{font-size:12px;color:var(--mu)}
.srch{position:relative}
.srch kbd{position:absolute;right:9px;top:8px;font:11px var(--mono);color:var(--mu);background:var(--sf-solid);border:1px solid var(--bd);border-radius:6px;padding:0 6px}
nav{flex:1;min-height:0;overflow:auto;margin:0 -6px;padding:0 6px}
nav h4{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
nav h4 i{width:8px;height:8px;border-radius:3px;box-shadow:0 0 8px currentColor}
nav h4 span{margin-left:auto;font-weight:400}

.nv{
  display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);
  padding:8px 12px;border-radius:10px;cursor:pointer;font:inherit;
  transition:transform .18s cubic-bezier(.22,1,.36,1), background .18s ease, color .18s ease;
}
.nv:hover{background:var(--sf2);transform:translateX(4px)}
.nv.on{
  background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 18%,transparent),color-mix(in srgb,var(--ac2) 8%,transparent));
  color:var(--ac);font-weight:600;border-left:3px solid var(--ac);
}
.nv u{color:var(--wr);text-decoration:none;font-size:10px}
.sfoot{display:grid;gap:8px}

.b{
  background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 80%,var(--ac2)));
  color:var(--on);border:0;border-radius:10px;padding:8px 14px;cursor:pointer;
  font:inherit;font-weight:600;position:relative;overflow:hidden;
  transition:transform .16s cubic-bezier(.22,1,.36,1), filter .16s ease, box-shadow .2s ease;
}
.b:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:var(--glow)}
.b:active{transform:scale(.97)}
.b.g{background:var(--sf2);color:var(--tx);font-weight:500;box-shadow:none}
.b.g:hover{background:color-mix(in srgb,var(--ac) 12%,var(--sf2));color:var(--ac)}
.b.d{background:linear-gradient(135deg,#e11d48,#be123c);color:#fff}
.b.sm{padding:5px 10px;font-size:12px;border-radius:8px}

input,select,textarea{
  width:100%;background:var(--sf2);color:var(--tx);border:1px solid transparent;
  border-radius:10px;padding:9px 11px;font:inherit;
  transition:border-color .18s,background .18s,box-shadow .18s,transform .15s;
}
input:focus,select:focus,textarea:focus{
  outline:0;border-color:var(--ac);background:var(--sf-solid);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent);
}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
textarea{font-family:var(--mono);font-size:12.5px;resize:vertical}

header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:6px 0 16px}
h1{margin:4px 0 0;font-size:24px;letter-spacing:-.01em;background:linear-gradient(90deg,var(--tx),var(--ac));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header p{margin:2px 0 0}
.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--ac) 25%,transparent);
  border-radius:999px;padding:2px 10px;
}

.card{
  background:var(--sf);backdrop-filter:blur(12px);
  border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);
  transition:border-color .2s ease, transform .2s ease;
}
.card:hover{border-color:color-mix(in srgb,var(--ac) 30%,var(--bd))}
.ch{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.en{width:24px;height:24px;border-radius:8px;background:var(--ac);color:var(--on);display:grid;place-items:center;font-size:12px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:8px}
.chip{
  border:1px solid var(--bd);background:var(--sf2);color:var(--tx);border-radius:999px;
  padding:2px 12px;cursor:pointer;font:inherit;font-size:12px;
  transition:all .16s ease;
}
.chip:hover{border-color:var(--ac);color:var(--ac);transform:translateY(-1px)}
.x{margin-left:auto;background:none;border:0;color:var(--mu);cursor:pointer;font-size:16px;border-radius:8px;padding:2px 8px}
.x:hover{background:var(--sf2);color:#e11d48}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.wide{grid-column:1/-1}
label span{display:block;font-size:12px;color:var(--mu);margin-bottom:4px;font-weight:600}em{font-style:normal;font-weight:400;opacity:.8}

/* Command Toggle Control Bar */
.cmd-ctrl{
  background:color-mix(in srgb,var(--sf2) 75%,var(--sf-solid));
  border:1px dashed color-mix(in srgb,var(--ac) 40%,var(--bd));
  border-radius:12px;padding:10px 14px;margin-bottom:12px;
  display:flex;flex-direction:column;gap:8px;
}
.cmd-ctrl-title{font-size:12px;font-weight:700;color:var(--ac);display:flex;align-items:center;justify-content:space-between}
.cmd-toggles{display:flex;flex-wrap:wrap;gap:8px}
.cmd-btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 11px;border-radius:9px;font-size:12px;font-family:var(--mono);
  border:1px solid var(--bd);background:var(--sf-solid);color:var(--tx);
  cursor:pointer;transition:all .18s cubic-bezier(.22,1,.36,1);
  max-width:100%;
}
.cmd-btn:hover{border-color:var(--ac);transform:translateY(-1px)}
.cmd-btn.on{
  background:color-mix(in srgb,var(--ac) 16%,var(--sf-solid));
  border-color:var(--ac);color:var(--ac);font-weight:600;
  box-shadow:0 2px 10px color-mix(in srgb,var(--ac) 18%,transparent);
}
.cmd-btn.off{
  opacity:0.52;text-decoration:line-through;background:var(--sf2);color:var(--mu);
}
.cmd-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  background:var(--mu);transition:background .18s, box-shadow .18s;
}
.cmd-btn.on .cmd-dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.cmd-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}

/* Category Selector & Manual Input Combo */
.cat-wrap{display:flex;gap:6px;align-items:center}
.cat-wrap select{flex:1;min-width:115px}
.cat-wrap input{flex:1.2;min-width:120px}

.pv{position:sticky;bottom:0;margin-top:auto;background:var(--code);border-radius:14px;overflow:hidden;box-shadow:0 -14px 18px var(--bg),var(--sh);border:1px solid rgba(45,212,191,.2)}
.pvh{display:flex;gap:10px;align-items:center;padding:9px 14px;color:#9db4cf;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.06)}.pvh b{color:#e6edf7}
#warn{color:#f2b84b;flex:1;font-size:12px}.tg{display:flex;gap:6px;align-items:center;font-size:12px;cursor:pointer}.tg input{width:auto}
pre{margin:0;padding:8px 16px 14px;color:#c4f5e4;font:13px/1.65 var(--mono);white-space:pre-wrap;word-break:break-all;min-height:44px;max-height:38vh;overflow:auto}
.basket textarea{flex:1;min-height:200px;resize:none;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

dialog{border:1px solid var(--bd);border-radius:18px;background:var(--sf-solid);color:var(--tx);width:min(920px,95vw);max-height:92vh;padding:0;box-shadow:0 24px 60px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(4,9,20,.65);backdrop-filter:blur(5px)}
.dl{padding:20px;display:grid;gap:12px}.dh{display:flex;align-items:center}.dh h2{margin:0;font-size:19px}
.g3{display:grid;grid-template-columns:1.2fr 1.4fr 1.2fr;gap:10px}
.ft{width:100%;border-collapse:collapse;font-size:13px}.ft th{text-align:left;color:var(--mu);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--bd)}.ft td{padding:6px 6px;vertical-align:middle;border-bottom:1px solid color-mix(in srgb,var(--bd) 50%,transparent)}
.ft tr.fx td:not(:nth-child(3)){opacity:.5}.ex{font:12px var(--mono);color:var(--mu);word-break:break-all;max-width:220px}
.help{font-size:12px;color:var(--mu);background:var(--sf2);border-radius:10px;padding:8px 12px}.help code{font-family:var(--mono)}
details summary{cursor:pointer;color:var(--mu);font-size:13px;margin-bottom:8px}
.dpv{background:var(--code);border-radius:12px;overflow:hidden}.dpv b{display:block;padding:8px 14px 0;color:#9db4cf;font-size:12px}.dpv pre{max-height:200px}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,var(--ok),#059669);color:#fff;
  padding:9px 20px;border-radius:20px;z-index:999;box-shadow:0 10px 25px rgba(18,163,107,.35);
  font-weight:600;font-size:13px;
}

@media(max-width:1000px){.app{grid-template-columns:1fr;height:auto}main{overflow:visible}.pv{position:static}.g3{grid-template-columns:1fr}}
[hidden]{display:none!important}

.lg{position:fixed;inset:0;display:grid;place-items:center;background:transparent;padding:20px;z-index:50;overflow:auto}
.lgc{
  width:min(430px,100%);background:var(--sf);backdrop-filter:blur(20px);
  border:1px solid var(--bd);border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.25);
  padding:28px;display:grid;gap:14px;position:relative;z-index:2;
}
.lgc h2{margin:0;font-size:18px}.err{color:#e11d48;font-size:13px;min-height:18px;font-weight:500}
.lnk{background:none;border:0;color:var(--ac);cursor:pointer;font:inherit;font-size:12.5px;text-decoration:underline;font-weight:600}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);padding:8px 14px;cursor:pointer;font:inherit;font-weight:600;transition:color .15s}.tab.on{color:var(--ac);border-color:var(--ac)}
.usr{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:13px;padding-top:4px}.usr small{display:block;color:var(--mu);font-size:11px}
.sub{margin:4px 0 4px 26px}.app.nobk{grid-template-columns:278px minmax(0,1fr)}
h3{margin:14px 0 6px;font-size:14px}.dl details{background:var(--sf2);border-radius:10px;padding:8px 12px;margin:4px 0}.dl summary{margin:0;color:var(--tx);font-weight:600}.dl details[open] summary{margin-bottom:8px}

.xl-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:8px;background:rgba(16,185,129,.14);color:#10b981;
  border:1px solid rgba(16,185,129,.3);
}
.xl-badge.warn{background:rgba(245,158,11,.14);color:#f59e0b;border-color:rgba(245,158,11,.3)}
.upd-btn{
  background:linear-gradient(135deg,#0284c7,#0d9488);
  color:#fff;border:0;border-radius:10px;padding:8px 12px;cursor:pointer;
  font:inherit;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 4px 14px rgba(2,132,199,.28);transition:all .18s ease;
}
.upd-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.upd-btn.dirty{
  background:linear-gradient(135deg,#f59e0b,#ea580c);
  box-shadow:0 4px 16px rgba(245,158,11,.38);
  animation:pulseWarn 2s infinite;
}
@keyframes pulseWarn{
  0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.45)}
  50%{box-shadow:0 0 0 6px rgba(245,158,11,0)}
}

/* Pro Upgrade Workbench */
.upgrade-status{font-size:11px;color:var(--mu);padding:4px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--sf2);text-align:center}
.tool-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tool-card{border:1px solid var(--bd);border-radius:12px;background:var(--sf2);padding:12px;min-width:0}
.tool-card h3{margin:0 0 8px;font-size:14px}.tool-card textarea{min-height:110px}
.tool-output{background:var(--code);color:#b7f7d4;border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-word;font:12px/1.6 var(--mono);max-height:340px;overflow:auto}
.tool-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tool-kpi div{background:var(--sf2);border:1px solid var(--bd);padding:10px;border-radius:10px;text-align:center}
.tool-kpi b{display:block;font-size:20px;color:var(--ac)}.tool-kpi small{color:var(--mu)}
.tool-list{max-height:260px;overflow:auto;border:1px solid var(--bd);border-radius:10px;padding:8px}
.tool-row{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
@media(max-width:1000px){.tool-grid{grid-template-columns:1fr}.tool-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.app{padding:8px;gap:8px}.side,.basket{padding:12px;border-radius:14px}header{flex-direction:column}h1{font-size:21px}.tool-card{padding:10px}}


.devbrand{color:var(--ac)!important;font-weight:700!important;letter-spacing:.02em;font-size:11px!important;margin-top:2px}
#proBtn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on);font-weight:700}
.pro-compact>section:nth-child(n+3):not(.pro-favorites){display:none!important}
.pro-output{display:none!important}
.side>.brand .logo #lottie-brand{display:none!important}
.side>.brand .logo:after{content:"⚡";font-size:21px;color:white;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
#login .brand .logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,#0d9488,#0284c7);box-shadow:0 12px 24px rgba(2,132,199,.24);font-size:22px}
#login .brand .logo:before{content:'◆';font-size:19px;color:white;transform:rotate(45deg);opacity:.95}
#login .brand .logo #lottie-brand{display:none}
#login .brand .logo{font-size:0!important}
#login .brand .logo:before{content:'⚡';font-size:24px;color:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2)}

</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<div class="app" id="app" hidden="">
  <aside class="side">
    <div class="brand">
      <span class="logo"><span id="lottie-brand">⚡</span></span>
      <div>Script Studio<small>MikroTik RouterOS v7 · Pro</small></div>
    </div>
    <div class="srch"><input id="q" placeholder="Template খুঁজুন…"><kbd>Ctrl K</kbd></div>
    <nav id="nav"></nav>
    <div class="sfoot">
      <button class="b" id="newT">＋ Template builder</button>
      <button class="b g" id="proBtn" hidden="">🧰 Pro Tools</button>
      <button class="upd-btn" id="updHtmlBtn" title="যেকোনো পরিবর্তনের পর মূল HTML ফাইলটি সিলেক্ট করে সরাসরি আপডেট করুন">💾 Update HTML File</button>
      <div class="upgrade-status" id="saveStatus">● Local autosave active · HTML sync pending</div><button class="b g sm" id="ackHtmlSync" hidden="">✓ Downloaded HTML replace করেছি</button>
      <div class="row">
        <button class="b g" id="adm" style="flex:1">⚙ Admin</button>
        <button class="b g" id="theme" style="flex:1">◐ Theme</button>
      </div>
      <div class="usr"><div id="uchip"></div><button class="b g sm" id="lo">Logout</button></div>
    </div>
  </aside>
  <main id="main"></main>
  <aside class="basket" id="bkp">
    <div class="brand"><span class="logo">▤</span><div>Script basket<small id="bc"></small></div></div>
    <textarea id="bk" spellcheck="false" placeholder="একাধিক template-এর script এখানে জমা হবে। এখান থেকেই edit করা যায়।"></textarea>
    <div class="row"><button class="b" id="bcopy">Copy</button><button class="b g" id="bsave">Save .rsc</button><button class="b g" id="bclr">Clear</button></div>
    <div class="note">Winbox/SSH-এ paste করার আগে Safe Mode অন রাখুন। অথবা .rsc router-এ upload করে: /import file-name=setup.rsc</div>
  </aside>
</div>

/* ===================== ENGINE ===================== */
const LABELS={name:'Name',id:'ID',iface:'Interface',comment:'Comment',addr:'Address (IP/prefix)',new:'New address',pub:'Public IP',pubport:'Public port',to:'Internal IP',toport:'Internal port',proto:'Protocol',num:'Rule number',list:'List name',dst:'Destination',chain:'Chain',pos:'Place-before (optional)',names:'Names',target:'Target',ip:'IP',sites:'Site IPs',net:'Network',dns:'DNS server',action:'Action',newname:'New name',users:'Usernames',pass:'Password',peer:'Peer IP',ras:'Remote AS',las:'Local AS',role:'Role',out:'Output filter chain',in:'Input filter',nl:'Output network list',rid:'Router-ID',profile:'Profile',limit:'Max-limit'};
const PH=/\{\{\s*([\w-]+)(\*)?(?:\s*=\s*([^}]*?))?\s*\}\}/g, OP=/\{\?([\s\S]*?)\?\}/g;

// Helper to parse template body lines while keeping original line indices (for command toggling)
function bodyLinesOf(t){
  return (t.body||'').split('\n').map((raw,idx)=>({raw:raw.trim(),idx})).filter(x=>x.raw);
}

function fieldsOf(t, activeBody){
  const srcBody = activeBody !== undefined ? activeBody : t.body;
  const m={},req=new Set();
  srcBody.replace(PH,(a,k,s,d)=>{
    const f=m[k]=m[k]||{k,def:'',list:false,opts:null,set:false,label:(t.labels||{})[k]||LABELS[k]||k.replace(/[-_]/g,' ')};
    if(s)f.list=true;
    if(d!==undefined&&!f.set){f.set=true;
      if(d.includes('|')){const o=d.split('|').map(x=>x.trim());if(s)f.def=o.join('\n');else{f.opts=o;f.def=o[0]}}
      else f.def=d.trim()}
    return a});
  srcBody.replace(OP,'').replace(PH,(a,k)=>(req.add(k),a));
  return Object.values(m).map(f=>({...f,opt:!req.has(f.k)}));
}

function render(t,v,disabledSet){
  const lines = bodyLinesOf(t).filter(x => !disabledSet || !disabledSet.has(x.idx));
  if(!lines.length) return [];
  const filteredBody = lines.map(x=>x.raw).join('\n');
  const F=Object.fromEntries(fieldsOf(t, filteredBody).map(f=>[f.k,f]));
  const val=k=>(v[k]||'').trim();
  const items=k=>val(k).split('\n').map(s=>s.trim()).filter(Boolean);
  const empty=k=>!F[k] || (F[k].list?!items(k).length:!val(k));
  const b=filteredBody.replace(OP,(a,inner)=>{let ok=true;inner.replace(PH,(x,k)=>(empty(k)&&(ok=false),x));return ok?inner:''});
  return b.split('\n').map(l=>l.trim()).filter(Boolean).flatMap(line=>{
    let star=null;line.replace(PH,(a,k,s)=>(s&&!star&&(star=k),a));
    const sub=it=>line.replace(PH,(a,k,s)=>{
      if(s&&k===star)return it;
      if(F[k]&&F[k].list)return items(k).join(',')||'‹'+k+'›';
      return val(k)||'‹'+k+'›'});
    if(star){const it=items(star);return it.length?it.map(sub):[sub('‹'+star+'›')]}
    return [sub()];
  });
}

function group(lines){const out=[];let cur='';
  lines.forEach(l=>{const m=l.match(/^(\/(?:[^\s\/]+\/)+)([^\s\/]\S*)([\s\S]*)$/);
    if(!m){out.push(l);cur='';return}
    if(m[1]!==cur){out.push(m[1]);cur=m[1]}
    out.push(m[2]+m[3])});
  return out}

const VERBS=new Set(['add','set','remove','disable','enable','print','find','comment','export','get','move','unset','edit','save','import','reset-counters','monitor','release','renew']);
const FLAGS=new Set(['blackhole','detail','where','brief','terse','without-paging','as-value','verbose']);
const FIXED=new Set(['chain','action','disabled','connection-state','connection-nat-state','in-interface-list','out-interface-list','service']);
const KEEP=/^(interface|place-before|list|max-limit|profile|distance|to-ports|remote-address|lease-time)$/;
const IPR=/^(\d{1,3}(?:\.\d{1,3}){3})(\/\d{1,2})?$/,IPS=/\d{1,3}(?:\.\d{1,3}){3}/,IPG=/\d{1,3}(?:\.\d{1,3}){3}(?:\/\d{1,2})?/g;
const IPL=/^\s*\d{1,3}(?:\.\d{1,3}){3}(?:\/\d{1,2})?(?:\s*,\s*\d{1,3}(?:\.\d{1,3}){3}(?:\/\d{1,2})?)*\s*$/;

function lex(s){const out=[];let i=0;const ws=c=>c===' '||c==='\t'||c==='\r';
  while(i<s.length){
    if(ws(s[i])){i++;continue}
    if(s[i]==='['){let d=1,j=i+1;while(j<s.length&&d){if(s[j]==='[')d++;else if(s[j]===']')d--;j++}
      out.push({t:'br',toks:lex(s.slice(i+1,d?j:j-1))});i=j;continue}
    let j=i;while(j<s.length&&!ws(s[j])&&s[j]!=='='&&s[j]!=='[')j++;
    const w=s.slice(i,j);
    if(s[j]==='='){j++;let q='',v;
      if(s[j]==='"'){q='"';let k=j+1;while(k<s.length&&(s[k]!=='"'||s[k-1]==='\\'))k++;v=s.slice(j+1,k);j=k+1}
      else{let k=j,d=0;while(k<s.length&&(d||!ws(s[k]))){const c=s[k];if(c==='('||c==='[')d++;else if((c===')'||c===']')&&d)d--;k++}v=s.slice(j,k);j=k}
      out.push({t:'kv',key:w,q,val:v})}
    else out.push({t:'b',text:w});
    i=Math.max(j,i+1)}
  return out}

function parseLine(L,ctx){L=L.trim();if(!L||L[0]==='#')return null;
  const m=L.match(/^(\S+)([\s\S]*)$/),t0=m[1],toks=lex(m[2]);let segs=[],verb;
  if(!/\s/.test(L)&&t0.includes('/')){const s=t0.split('/').filter(Boolean);if(!VERBS.has(s[s.length-1]))return{ctx:'/'+s.join('/')+'/'}}
  if(t0.includes('/')){segs=t0.split('/').filter(Boolean);if(VERBS.has(segs[segs.length-1]))verb=segs.pop();
    while(!verb&&toks.length&&toks[0].t==='b'){const w=toks.shift().text;VERBS.has(w)?verb=w:segs.push(w)}}
  else if(ctx&&VERBS.has(t0)){segs=ctx.split('/').filter(Boolean);verb=t0}
  if(!verb)return{raw:L};
  const path=segs.length?'/'+segs.join('/')+'/':'/';
  return{path,segs,verb,toks,head:path+verb}}

function attach(l){l.slots=[];
  const S=(key,val,kind,br)=>{const s={key:String(key||'x').replace(/[^\w-]/g,'-'),val,kind,suf:'',inBr:br,verb:l.verb};l.slots.push(s);return s};
  const walk=(toks,br)=>toks.forEach(tk=>{
    if(tk.t==='br')return walk(tk.toks,true);
    if(tk.t==='b'){if(!FLAGS.has(tk.text)&&tk.text!=='find')tk.slot=S(/^\d+$/.test(tk.text)?'num':'target',tk.text,'pos',br);return}
    if(IPL.test(tk.val)||!IPS.test(tk.val))tk.parts=[S(tk.key,tk.val,'kv',br)];
    else{tk.parts=[];let p=0;for(const m of tk.val.matchAll(IPG)){tk.parts.push(tk.val.slice(p,m.index),S('ip',m[0],'sub',br));p=m.index+m[0].length}tk.parts.push(tk.val.slice(p))}});
  walk(l.toks,false);const n=l.toks.filter(t=>t.t==='kv').length;l.slots.forEach(s=>s.nkv=n)}

function txt(l,f){if(l.raw)return l.raw;
  const T=tk=>tk.t==='br'?'['+tk.toks.map(T).join(' ')+']':tk.t==='b'?(tk.slot?f(tk.slot):tk.text):tk.key+'='+tk.q+tk.parts.map(x=>typeof x==='string'?x:f(x)).join('')+tk.q;
  const op=tk=>tk.t==='kv'&&tk.parts.length===1&&typeof tk.parts[0]!=='string'&&tk.parts[0].row&&tk.parts[0].row.mode==='opt';
  return l.head+l.toks.map(tk=>op(tk)?'{? '+T(tk)+'?}':' '+T(tk)).join('')}

function collapse(lines){const out=[];
  for(const l of lines){const p=out[out.length-1];
    if(p&&!p.raw&&!l.raw&&p.sk===l.sk){
      const d=l.slots.map((s,i)=>s.val!==p.slots[i].val?i:-1).filter(i=>i>=0);
      if(d.length===1&&(p.listIdx===undefined||p.listIdx===d[0])){const s=p.slots[d[0]];s.list=true;(s.vals=s.vals||[s.val]).push(l.slots[d[0]].val);p.listIdx=d[0];continue}}
    out.push(l)}
  return out}

function derive(lines){const slots=lines.flatMap(l=>l.slots||[]),rows=[],map={},used=new Set();
  const uniq=k=>{let n=k,i=2;while(used.has(n))n=k+i++;used.add(n);return n};
  slots.forEach(s=>{const ip=!s.list&&s.val.match(IPR);s.ipb=ip;
    const id=ip?'ip:'+ip[1]:(s.list||s.kind==='pos'||FIXED.has(s.key)||s.val.length<4||/^\d+$/.test(s.val)?s.key+'\0':'v\0')+(s.vals||[s.val]).join('\n');
    let r=map[id];if(!r){r=map[id]={key:uniq(s.key),slots:[],ip:!!ip};rows.push(r)}
    r.slots.push(s);s.row=r});
  rows.forEach(r=>{const f=r.slots[0],k=f.key;
    if(r.ip){if(new Set(r.slots.map(s=>s.ipb[2]||'')).size>1){r.ex=f.ipb[1];r.slots.forEach(s=>s.suf=s.ipb[2]||'')}else r.ex=f.val}
    else r.ex=(f.vals||[f.val]).join('\n');
    r.mode=f.list?'list':FIXED.has(k)?'fixed':k==='protocol'?'sel':(f.kind==='kv'&&!f.inBr&&((k==='comment'&&f.verb!=='comment')||k==='place-before'||(f.verb==='set'&&f.nkv>1)))?'opt':'in';
    r.opts=k==='protocol'?[...new Set([r.ex,'tcp','udp'])].join(','):'';
    r.def=r.mode==='list'?r.ex.split('\n').join('|'):(KEEP.test(k)?r.ex:'')});
  return rows}

function analyze(text){let ctx='',lines=[];
  text.split('\n').forEach(L=>{const p=parseLine(L,ctx);if(!p)return;if(p.ctx)ctx=p.ctx;else lines.push(p)});
  lines.forEach(l=>{if(!l.raw){attach(l);l.sk=txt(l,()=>'\u0001')}});
  lines=collapse(lines);return{lines,rows:derive(lines)}}

function bodyOf(lines,rows){
  const ph=s=>{const r=s.row;if(!r||r.mode==='fixed')return s.val;
    const d=r.mode==='sel'?r.opts.split(/[,|]/).map(x=>x.trim()).filter(Boolean).join('|'):r.mode==='list'?r.def.trim():r.def.trim().replace(/[{}|]/g,'');
    return '{{'+r.key+(r.mode==='list'?'*':'')+(d?'='+d:'')+'}}'+s.suf};
  return lines.map(l=>txt(l,ph)).join('\n')}
//#END

/* ===================== UI & ANIMATIONS ===================== */
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){console.warn('Local save failed for '+k,e);return false}}};
let cur=LS.get('mt_cur',''),bk='',grp=LS.get('mt_grp',true),ents=[],q='';
let disabledCmds = new Set(); // Stores indices of commands toggled OFF by user

const all=()=>vis(),T=()=>all().find(t=>t.id===cur)||all()[0];
const defs=t=>Object.fromEntries(fieldsOf(t).map(f=>[f.k,f.def]));
const hue=s=>Math.abs([...s].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7))%360;

// Check if current user can toggle commands on template t
function canToggleCmds(t){
  if(!t) return false;
  if(isM()) return true;
  const u=me();
  if(!u) return false;
  const a=u.allow||{};
  if(a.cmdToggleAll) return true;
  return Array.isArray(a.cmdToggleIds) && a.cmdToggleIds.includes(t.id);
}

function activeBodyFor(t){
  if(!t) return '';
  const lines = bodyLinesOf(t);
  return lines.filter(x=>!disabledCmds.has(x.idx)).map(x=>x.raw).join('\n');
}

function outText(){
  const t=T();
  if(!t) return '';
  const ab = activeBodyFor(t);
  const must=fieldsOf(t, ab).filter(f=>!f.opt&&!f.def);
  const blank=v=>must.length&&must.every(f=>!(v[f.k]||'').trim());
  let E=ents.filter(v=>!blank(v));if(!E.length)E=[ents[0]];
  const L=E.flatMap(v=>render(t,v,disabledCmds));
  return(grp?group(L):L).join('\n');
}

function toast(m){
  const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);
  if(window.gsap){
    gsap.fromTo(e,{y:24,opacity:0,scale:.9},{y:0,opacity:1,scale:1,duration:.35,ease:'back.out(1.7)'});
    gsap.to(e,{y:-16,opacity:0,duration:.3,delay:1.5,onComplete:()=>e.remove()});
  }else setTimeout(()=>e.remove(),1800);
}

function copy(s){
  const fb=()=>{const a=document.createElement('textarea');a.value=s;document.body.append(a);a.select();document.execCommand('copy');a.remove();toast('Copied')};
  try{navigator.clipboard.writeText(s).then(()=>toast('Copied'),fb)}catch(e){fb()}
}

function dl(name,text){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
}

/* ---------- Three.js Subtle Particle Mesh Background ---------- */
function initThreeBG(){
  try{
    if(!window.THREE) return;
    const canvas = $('#bg-canvas');
    const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 32;

    const geo = new THREE.BufferGeometry();
    const count = 90;
    const pos = new Float32Array(count * 3);
    for(let i=0;i<count*3;i++) pos[i] = (Math.random() - 0.5) * 65;
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

    const mat = new THREE.PointsMaterial({color: 0x14b8a6, size: 0.35, transparent:true, opacity:0.65});
    const points = new THREE.Points(geo, mat);
    scene.add(points);

    const wireGeo = new THREE.IcosahedronGeometry(14, 1);
    const wireMat = new THREE.MeshBasicMaterial({color: 0x0ea5e9, wireframe:true, transparent:true, opacity:0.07});
    const mesh = new THREE.Mesh(wireGeo, wireMat);
    scene.add(mesh);

    window.addEventListener('resize', ()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate(){
      requestAnimationFrame(animate);
      points.rotation.y += 0.0008;
      points.rotation.x += 0.0004;
      mesh.rotation.y -= 0.0012;
      mesh.rotation.z += 0.0007;
      renderer.render(scene, camera);
    }
    animate();
  }catch(e){}
}

function setT(id){
  cur=id;const t=T();cur=t?t.id:'';LS.set('mt_cur',cur);

function nav(){
  const g={};
  all().filter(t=>!q||(t.name+t.desc+t.cat+t.body).toLowerCase().includes(q)).forEach(t=>(g[t.cat]=g[t.cat]||[]).push(t));
  $('#nav').innerHTML=Object.entries(g).map(([c,a])=>`<h4><i style="background:hsl(${hue(c)} 65% 52%)"></i>${esc(c)}<span>${a.length}</span></h4>`+a.map(t=>`<button class="nv${t.id===cur?' on':''}" data-id="${esc(t.id)}">${esc(t.name)}${t.src==='custom'?' <u>●</u>':''}</button>`).join('')).join('')||'<p class="mu">কিছু পাওয়া যায়নি</p>';
}

function cmdToggleBar(t){
  if(!canToggleCmds(t)) return '';
  const lines = bodyLinesOf(t);
  if(lines.length <= 1) return ''; // Only meaningful when template has multiple commands/lines
  return `<div class="cmd-ctrl">
    <div class="cmd-ctrl-title">
      <span>⚡ Command Output Control (কোন command-গুলো output-এ থাকবে তা বেছে নিন)</span>
      <div class="row">
        <button class="b g sm" id="cmdAllOn" type="button">সব ON</button>
        <button class="b g sm" id="cmdAllOff" type="button">সব OFF</button>
      </div>
    </div>
    <div class="cmd-toggles">
      ${lines.map((l,i)=>{
        const isOn = !disabledCmds.has(l.idx);
        const label = l.raw.replace(/\{\{([^}=*]+)(?:\*)?(?:=[^}]*)?\}\}/g,'<$1>').replace(/\{\?[\s\S]*?\?\}/g,'');
        return `<button type="button" class="cmd-btn ${isOn?'on':'off'}" data-cidx="${l.idx}" title="${esc(l.raw)}">
          <span class="cmd-dot"></span>
          <span>#${i+1}</span>
          <span class="cmd-txt">${esc(label)}</span>
        </button>`;
      }).join('')}
    </div>
  </div>`;
}

  $('#main').innerHTML=`<header>

function cards(){
  const t=T();
  const ab = activeBodyFor(t);
  const F=fieldsOf(t, ab);
  const P=Object.keys(t.presets||{});
  if(!F.length && bodyLinesOf(t).length>0){
    $('#ents').innerHTML = `<div class="card"><p class="mu" style="margin:0">এই মুহূর্তে চালু থাকা command-গুলোর জন্য কোনো input field প্রয়োজন নেই। নিচে সরাসরি Output দেখুন।</p></div>`;
    return;
  }
  $('#ents').innerHTML=ents.map((v,i)=>`<div class="card" data-i="${i}">
    <div class="ch">
      <span class="en">${i+1}</span>
      ${P.length?`<div class="chips">${P.map(p=>`<button class="chip" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div>`:''}

      ${F.map(f=>`<label class="${f.list?'wide':''}">

function out(){
  const s=outText();
  $('#out').textContent=s || '# কোনো command সিলেক্ট করা নেই';

}

function sync(){
  $('#bk').value=bk;LS.set('mt_bk:'+session,bk);
  const n=bk.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')&&!/^\/\S*\/$/.test(l)).length;
  $('#bc').textContent=n+' command';
}
function addB(n,s){
  if(!s.trim())return;
  bk=(bk?bk+'\n':'# RouterOS v7 script · '+new Date().toISOString().slice(0,10)+'\n\n')+'# --- '+n+' ---\n'+s+'\n';
  sync();toast('Basket-এ যোগ হয়েছে');
}

$('#main').addEventListener('input',e=>{
  const k=e.target.dataset.k;if(!k)return;
  ents[e.target.closest('.card').dataset.i][k]=e.target.value;out();
});
$('#main').addEventListener('change',e=>{
  if(e.target.id==='grp'){grp=e.target.checked;LS.set('mt_grp',grp);out()}
});
$('#main').addEventListener('click',e=>{
  const cbtn = e.target.closest('.cmd-btn');
  if(cbtn){
    const idx = +cbtn.dataset.cidx;
    if(disabledCmds.has(idx)) disabledCmds.delete(idx);
    else disabledCmds.add(idx);
    draw();
    return;
  }
  const id=e.target.id,x=e.target.closest('.x'),pc=e.target.closest('.chip'),t=T();
  if(id==='cmdAllOn'){disabledCmds.clear();draw();}
  else if(id==='cmdAllOff'){bodyLinesOf(t).forEach(l=>disabledCmds.add(l.idx));draw();}
  else if(id==='addE'){if(ents.length>=maxE())return toast('Limit: সর্বোচ্চ '+maxE()+' entry');ents.push(defs(t));cards();out();animateCards()}
  else if(x){ents.splice(+x.closest('.card').dataset.i,1);cards();out()}
  else if(pc){Object.assign(ents[pc.closest('.card').dataset.i],t.presets[pc.dataset.p]);cards();out()}
  else if(id==='cp')copy(outText());
  else if(id==='ab')addB(t.name,outText());
  else if(id==='ed')build(t);
  else if(id==='cl')build({...t,id:'',name:t.name+' (copy)',src:'custom',owner:me().u,mo:false,mod:false});
  else if(id==='del'&&confirm('"'+t.name+'" delete করবেন?')){delT(t.id);setT('')}
});

/* ===================== Excel Database Link (File System Access API + SheetJS) ===================== */
let xlHandle = null;
let xlFileName = LS.get('mt_xl_name', '');

function usersToSheetRows(){
  return ws.users.map(u => {
    const a = u.allow || {};
    return {
      Username: u.u,
      DisplayName: u.name || '',
      Role: u.role || 'user',
      Status: u.active === false ? 'disabled' : 'active',
      PasswordHash: u.hash || '',
      Salt: u.salt || '',
      CanCreate: u.canCreate ? 'YES' : 'NO',
      CanCopy: u.canCopy !== false ? 'YES' : 'NO',
      CanSave: u.canSave !== false ? 'YES' : 'NO',
      CanBasket: u.canBasket !== false ? 'YES' : 'NO',
      MaxEntries: u.maxE || 10,
      AllowedAll: a.all ? 'YES' : 'NO',
      AllowedCats: (a.cats || []).join(','),
      AllowedIDs: (a.ids || []).join(','),
      CmdToggleAll: a.cmdToggleAll ? 'YES' : 'NO',
      CmdToggleIDs: (a.cmdToggleIds || []).join(','),
      CreatedAt: u.createdAt || new Date().toISOString().slice(0,10)
    };
  });
}

function buildWorkbookBuffer(){
  if(!window.XLSX) return null;
  const rows = usersToSheetRows();
  const sheet = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet, 'Users');
  return XLSX.write(wb, {bookType:'xlsx', type:'array'});
}

async function syncUsersToExcel(autoDownloadFallback = false){
  try{
    const buf = buildWorkbookBuffer();
    if(!buf) return;
    if(xlHandle){
      const writable = await xlHandle.createWritable();
      await writable.write(buf);
      await writable.close();
      toast('Excel database auto-updated (' + xlFileName + ')');
      return true;
    } else if(autoDownloadFallback){
      const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'mikrotik_users_db.xlsx';
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 500);
      toast('Excel file (mikrotik_users_db.xlsx) download হয়েছে');
      return true;
    }
  }catch(e){
    console.warn('Excel sync error:', e);
  }
  return false;
}

function importUsersFromWorkbook(wb, silent=false){
  const sheetName = wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName]);
  if(!Array.isArray(rows)) return 0;
  let count = 0;
  rows.forEach(r => {
    const uname = String(r.Username || '').trim();
    if(!uname) return;
    const existing = ws.users.find(x => x.u === uname);
    const parsedUser = {
      u: uname,
      name: String(r.DisplayName || uname).trim(),
      role: String(r.Role || 'user').toLowerCase() === 'master' ? 'master' : 'user',
      active: String(r.Status || 'active').toLowerCase() !== 'disabled',
      hash: String(r.PasswordHash || existing?.hash || ''),
      salt: String(r.Salt || existing?.salt || ''),
      canCreate: String(r.CanCreate || 'NO').toUpperCase() === 'YES',
      canCopy: String(r.CanCopy || 'YES').toUpperCase() !== 'NO',
      canSave: String(r.CanSave || 'YES').toUpperCase() !== 'NO',
      canBasket: String(r.CanBasket || 'YES').toUpperCase() !== 'NO',
      maxE: Number(r.MaxEntries) || 10,
      createdAt: String(r.CreatedAt || new Date().toISOString().slice(0,10)),
      allow: {
        all: String(r.AllowedAll || 'NO').toUpperCase() === 'YES',
        cats: String(r.AllowedCats || '').split(',').map(s=>s.trim()).filter(Boolean),
        ids: String(r.AllowedIDs || '').split(',').map(s=>s.trim()).filter(Boolean),
        cmdToggleAll: String(r.CmdToggleAll || 'NO').toUpperCase() === 'YES',
        cmdToggleIds: String(r.CmdToggleIDs || '').split(',').map(s=>s.trim()).filter(Boolean)
      }
    };
    if(existing){
      Object.assign(existing, parsedUser);
    } else if(parsedUser.hash && parsedUser.salt){
      ws.users.push(parsedUser);
    }
    count++;
  });
  persist();
  if(!silent) toast(count + 'টি user Excel থেকে sync হয়েছে');
  return count;
}

async function linkExcelFile(){
  try{
    if(window.showOpenFilePicker){
      const [handle] = await window.showOpenFilePicker({
        types:[{description:'Excel Workbook',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}],
        multiple:false
      });
      xlHandle = handle;
      xlFileName = handle.name;
      LS.set('mt_xl_name', xlFileName);
      const file = await handle.getFile();

      await syncUsersToExcel(false);

    } else {

    }
  }catch(e){}

}

try{seed=JSON.parse(document.getElementById('seed').textContent)}catch(e){}

const persist=()=>LS.set('mt_ws',ws);
let lastCommittedWorkspace=null,undoStack=LS.get('mt_undo',[]),redoStack=LS.get('mt_redo',[]);
function cloneWS(v){try{return JSON.parse(JSON.stringify(v))}catch(e){return null}}
function recordActivity(action){const log=LS.get('mt_activity',[]);log.unshift({at:new Date().toISOString(),user:session||'guest',action});LS.set('mt_activity',log.slice(0,250));}
const commit=()=>{
  if(lastCommittedWorkspace){undoStack.push(cloneWS(lastCommittedWorkspace));undoStack=undoStack.slice(-8);LS.set('mt_undo',undoStack);redoStack=[];LS.set('mt_redo',redoStack)}
  if(isM()) ws.rev=(ws.rev||0)+1;
  const localSaved=persist();lastCommittedWorkspace=cloneWS(ws);recordActivity('Workspace/template/user data saved');
  markHtmlDirty(true,localSaved?'● Local autosave complete · HTML sync pending':'⚠ Local save failed · storage space/settings issue · HTML sync pending');if(!localSaved)toast('Local auto-save failed! Browser storage check করুন।')

function loadWS(){ws=LS.get('mt_ws',null);
  if(seed&&seed.users&&(!ws||(seed.rev||0)>(ws.rev||0))){
    const mine=ws?(ws.tpls||[]).filter(t=>t.owner&&t.owner!=='master'&&!seed.tpls.some(s=>s.id===t.id)):[];
    ws=JSON.parse(JSON.stringify(seed));ws.tpls.push(...mine);persist()}
  if(!ws)ws={v:4,rev:0,packVer:0,allowSignup:true,users:[],tpls:[],removed:[]};
  if(ws.allowSignup === undefined) ws.allowSignup = true;
}

const me=()=>ws.users.find(u=>u.u===session);
function isM(){const u=me();return !!u&&u.role==='master'}
function visFor(u){if(u.role==='master')return ws.tpls;const a=u.allow||{};
  return ws.tpls.filter(t=>!t.mo&&(t.owner===u.u||a.all||(a.cats||[]).includes(t.cat)||(a.ids||[]).includes(t.id)))}
function vis(){const u=me();return u?visFor(u):[]}
const canEdit=t=>isM()||(!!me()&&me().canCreate===true&&t.owner===me().u);
const P=k=>isM()||(!!me()&&me()[k]!==false);
const maxE=()=>isM()?99:(me().maxE||10);
function saveT(t){const i=ws.tpls.findIndex(x=>x.id===t.id);i>=0?ws.tpls[i]=t:ws.tpls.push(t);commit()}
function delT(id){const t=ws.tpls.find(x=>x.id===id);if(!t||!canEdit(t))return;ws.tpls=ws.tpls.filter(x=>x.id!==id);if(t.src==='builtin'&&!ws.removed.includes(id))ws.removed.push(id);commit()}
function mergePack(list,force){let a=0,u=0,s=0;
  list.forEach(b=>{const i=ws.tpls.findIndex(t=>t.id===b.id);
    if(i<0){if(force||!ws.removed.includes(b.id)){ws.tpls.push({...b,src:b.src||'builtin',owner:'master',mod:false});a++}}
    else{const t=ws.tpls[i];if(force||(!t.mod&&(b.pv||1)>(t.pv||1))){ws.tpls[i]={...b,src:t.src,owner:t.owner,mo:t.mo,mod:false};u++}else s++}});
  return{a,u,s}}

const enc=s=>new TextEncoder().encode(s);
async function hashPw(pw,salt){const k=await crypto.subtle.importKey('raw',enc(pw),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc(salt),iterations:100000},k,256);
  return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const rnd=()=>[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function mkUser(u,name,pw,extra){
  const salt=rnd();
  return{
    u,name,salt,hash:await hashPw(pw,salt),
    role:'user',active:true,
    allow:{all:false,cats:[],ids:[],cmdToggleAll:false,cmdToggleIds:[]},
    canCreate:false,canCopy:true,canSave:true,canBasket:true,maxE:10,
    createdAt:new Date().toISOString().slice(0,10),
    ...extra
  };
}

function markHtmlDirty(dirty = true, stateText=''){

function buildUpdatedHtmlString(targetUser = ''){
  const w = JSON.parse(JSON.stringify(ws));
  if(targetUser){
    const x = ws.users.find(v => v.u === targetUser);
    w.users = [x];
    w.tpls = visFor(x).map(t => ({...t}));
    w.removed = [];
  }
  const j = JSON.stringify(w).replace(/</g, '\\u003c');
  return RAW_HTML.replace(/(<script type="application\/json" id="seed">)[\s\S]*?(<\/script>)/, (m, a, b) => a + j + b);

async function updateSameHtmlFile(forcePickNew = false){

  }catch(e){

    $d('#ghSync').onclick=async()=>{try{const cfg={owner:$d('#ghOwner').value.trim(),repo:$d('#ghRepo').value.trim(),branch:$d('#ghBranch').value.trim()||'main',path:$d('#ghPath').value.trim()||'index.html'},token=$d('#ghToken').value.trim();if(!cfg.owner||!cfg.repo||!cfg.path||!token)return ghStatus('Owner, repo, file path ও token পূরণ করুন।');LS.set('mt_gh_cfg',cfg);sessionStorage.setItem('mt_gh_token',token);ghStatus('GitHub repository যাচাই হচ্ছে…');const api='https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+cfg.path.split('/').map(encodeURIComponent).join('/');const headers={Authorization:'Bearer '+token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};let sha=null;const existing=await fetch(api+'?ref='+encodeURIComponent(cfg.branch),{headers});if(existing.ok){const data=await existing.json();sha=data.sha}else if(existing.status!==404){const er=await existing.json().catch(()=>({message:existing.statusText}));throw new Error(er.message||'GitHub file read failed');}const src=buildUpdatedHtmlString('');const bytes=new TextEncoder().encode(src);let binary='';for(let i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);const content=btoa(binary);const payload={message:'Update MikroTik Script Studio HTML from Master panel',content,branch:cfg.branch};if(sha)payload.sha=sha;const put=await fetch(api,{method:'PUT',headers,body:JSON.stringify(payload)});if(!put.ok){const er=await put.json().catch(()=>({message:put.statusText}));throw new Error(er.message||'Commit failed');}const result=await put.json();const commitUrl=result.commit&&result.commit.html_url;ghStatus('✅ GitHub-এ commit হয়েছে'+(commitUrl?' · '+commitUrl:''));markHtmlDirty(false,'● Local save · GitHub commit synced');toast('GitHub commit সফল! Pages deploy হলে live হবে।');if(commitUrl)window.open(commitUrl,'_blank','noopener');}catch(err){ghStatus('❌ Sync failed: '+err.message);alert('GitHub Sync ব্যর্থ: '+err.message+' /* ---------- User Form (Role Selector: Master/Regular + Per-Template Command Toggle Privilege) ---------- */
function userForm(name){
  const d=$('#dlg'),$d=s=>d.querySelector(s);
  const old=ws.users.find(x=>x.u===name);
  const isSelf = old && old.u === me().u;
  const u=old||{u:'',name:'',role:'user',active:true,allow:{all:false,cats:[],ids:[],cmdToggleAll:false,cmdToggleIds:[]},canCreate:false,canCopy:true,canSave:true,canBasket:true,maxE:10};
  const a=u.allow||{};
  const on=t=>a.all||(a.cats||[]).includes(t.cat)||(a.ids||[]).includes(t.id);
  const cmdOn=t=>a.cmdToggleAll||(a.cmdToggleIds||[]).includes(t.id);

  const G={};ws.tpls.filter(t=>!t.mo).forEach(t=>(G[t.cat]=G[t.cat]||[]).push(t));
  const multiCmdTpls = ws.tpls.filter(t=>!t.mo && bodyLinesOf(t).length > 1);
  const ck=(id,l,v)=>`<label class="tg"><input type="checkbox" id="${id}"${v?' checked':''}> ${l}</label>`;

  d.innerHTML=`<div class="dl">
    <div class="dh"><h2>${old?'User edit: '+esc(name):'New user'}</h2><button class="x" id="ux">✕</button></div>
    <div class="g3">
      <label><span>Username</span><input id="fu" value="${esc(u.u)}"${old?' disabled':''}></label>
      <label><span>Display name</span><input id="fn" value="${esc(u.name||'')}"></label>
      <label><span>${old?'নতুন password (খালি = আগেরটাই)':'Password (min 6)'}</span><input id="fp" type="password" autocomplete="new-password"></label>
    </div>

    <div class="row" style="justify-content:space-between;background:var(--sf2);padding:10px 14px;border-radius:12px">
      <label style="flex:1;min-width:180px">
        <span>User Role (Master / Regular)</span>
        <select id="frole" ${isSelf?'disabled':''}>
          <option value="user"${u.role!=='master'?' selected':''}>Regular User (নিয়ন্ত্রিত অনুমতি)</option>
          <option value="master"${u.role==='master'?' selected':''}>Master User (সম্পূর্ণ Admin ক্ষমতা)</option>
        </select>
      </label>
      <div style="padding-top:18px">${ck('fa','Account চালু (Active)',u.active!==false)}</div>
    </div>

    <div id="regOpts" ${u.role==='master'?'hidden':''}>
      <div class="card">
        <b>Template access</b>
        <div class="row" style="margin:6px 0">
          <label class="tg"><input type="radio" name="am" value="all"${a.all?' checked':''}> সব template</label>
          <label class="tg"><input type="radio" name="am" value="sel"${a.all?'':' checked'}> শুধু নির্বাচিত</label>
        </div>
        <div id="tt">${Object.entries(G).map(([c,L])=>`<details><summary><label class="tg"><input type="checkbox" data-cat="${esc(c)}"${L.every(on)?' checked':''}> ${esc(c)} (${L.length})</label></summary>${L.map(t=>`<label class="tg sub"><input type="checkbox" data-id="${esc(t.id)}"${on(t)?' checked':''}> ${esc(t.name)}</label>`).join('')}</details>`).join('')}</div>
      </div>

      <div class="card">
        <b>⚡ Command Output Toggle Button Privilege</b>
        <p class="note" style="margin:2px 0 8px">কোন কোন template-এ এই user প্রতিটি command আলাদাভাবে ON/OFF করার button দেখতে পাবে তা নির্ধারণ করুন:</p>
        <div class="row" style="margin-bottom:6px">
          <label class="tg"><input type="checkbox" id="fcmdAll"${a.cmdToggleAll?' checked':''}> সব allowed multi-command template-এ button দেখাবে</label>
        </div>
        <div id="cmdList" style="max-height:160px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px;padding:6px;background:var(--sf2);border-radius:10px">
          ${multiCmdTpls.map(t=>`<label class="tg"><input type="checkbox" data-cmdid="${esc(t.id)}"${cmdOn(t)?' checked':''}> ${esc(t.name)} <small class="mu">(${bodyLinesOf(t).length} cmds)</small></label>`).join('') || '<span class="mu">একাধিক command যুক্ত কোনো template নেই</span>'}
        </div>
      </div>

      <div class="card" style="margin-bottom:0">
        <b>Limits</b>
        <div class="row" style="margin-top:6px">
          ${ck('fc','নিজের template বানাতে/edit করতে পারবে',u.canCreate)}
          ${ck('fpt','Pro Tools ব্যবহার করতে পারবে (IP Calculator, Validator, Favorites)',u.canProTools===true)}
          ${ck('fy','Copy করতে পারবে',u.canCopy!==false)}
          ${ck('fs','.rsc save করতে পারবে',u.canSave!==false)}
          ${ck('fb','Basket ব্যবহার করতে পারবে',u.canBasket!==false)}
          <label class="tg">সর্বোচ্চ entry <input id="fm" type="number" min="1" max="99" value="${u.maxE||10}" style="width:76px"></label>
        </div>
      </div>
    </div>

    <div id="fe" class="err"></div>
    <div class="row"><button class="b" id="fsave">Save &amp; Sync</button><button class="b g" id="fx">Cancel</button></div>
  </div>`;

  $d('#frole').onchange = e => {
    $d('#regOpts').hidden = e.target.value === 'master';
  };

  const tt=$d('#tt');if(tt)tt.addEventListener('change',e=>{const c=e.target.dataset.cat,g=e.target.closest('details');
    if(c!==undefined)g.querySelectorAll('[data-id]').forEach(i=>i.checked=e.target.checked);
    else g.querySelector('[data-cat]').checked=[...g.querySelectorAll('[data-id]')].every(i=>i.checked)});

  $d('#fx').onclick=$d('#ux').onclick=()=>admin('u');
  $d('#fsave').onclick=async()=>{
    const er=s=>$d('#fe').textContent=s,un=old?name:$d('#fu').value.trim(),pw=$d('#fp').value;
    if(!old){if(!/^[\w.-]{3,}$/.test(un))return er('Username কমপক্ষে ৩ অক্ষর (a-z 0-9 . _ -)');if(ws.users.some(x=>x.u===un))return er('এই username আছে');if(pw.length<6)return er('Password কমপক্ষে ৬ অক্ষর')}
    else if(pw&&pw.length<6)return er('Password কমপক্ষে ৬ অক্ষর');

    const newRole = isSelf ? 'master' : $d('#frole').value;
    const x=old||{u:un,createdAt:new Date().toISOString().slice(0,10)};
    x.name=$d('#fn').value.trim();
    x.role=newRole;
    x.active=$d('#fa').checked;
    if(pw){x.salt=rnd();x.hash=await hashPw(pw,x.salt)}

    if(newRole === 'master'){
      x.allow = {all:true, cats:[], ids:[], cmdToggleAll:true, cmdToggleIds:[]};
    } else {
      const allm=d.querySelector('input[name=am]:checked').value==='all',cats=[],ids=[];
      if(!allm)d.querySelectorAll('#tt details').forEach(g=>{const b=[...g.querySelectorAll('[data-id]')];if(b.length&&b.every(i=>i.checked))cats.push(g.querySelector('[data-cat]').dataset.cat);else b.filter(i=>i.checked).forEach(i=>ids.push(i.dataset.id))});
      const cmdToggleAll = $d('#fcmdAll').checked;
      const cmdToggleIds = [...d.querySelectorAll('[data-cmdid]:checked')].map(i=>i.dataset.cmdid);
      x.allow={all:allm,cats,ids,cmdToggleAll,cmdToggleIds};
      x.canCreate=$d('#fc').checked;x.canProTools=$d('#fpt').checked;x.canCopy=$d('#fy').checked;x.canSave=$d('#fs').checked;x.canBasket=$d('#fb').checked;x.maxE=Math.max(1,Math.min(99,+$d('#fm').value||10));
    }
    if(!old)ws.users.push(x);
    commit();
    admin('u');
  };
}
